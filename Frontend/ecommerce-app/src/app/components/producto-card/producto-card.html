<div class="card h-full bg-base-100 border border-base-300/60
            hover:-translate-y-1 hover:border-primary/35
            transition-all duration-300 overflow-hidden group">

  <!-- IMAGEN -->
  <a [routerLink]="['/productos', producto().id]" class="block">
    <figure class="relative h-64 bg-base-200 overflow-hidden m-0 p-0">

      <img [src]="imagenProducto()" [alt]="producto().nombre"
        class="block w-full h-full object-cover group-hover:scale-[1.035] transition-transform duration-700" />

      <!-- CATEGORÍA -->
      <div class="absolute top-3 left-3">
        <span
          class="badge bg-base-100/90 text-base-content backdrop-blur-sm border border-base-300/50 font-semibold text-[10px] uppercase tracking-wider">
          {{ producto().categoriaNombre }}
        </span>

        @if (producto().stock === 0) {
        <span
          class="badge badge-error bg-error/90 text-base-100 backdrop-blur-sm border border-error/50 shadow-sm font-semibold ml-2">
          Sin stock
        </span>
        }
      </div>

    </figure>
  </a>


  <!-- CONTENIDO -->
  <div class="card-body p-5 gap-2">

    <div class="min-h-14">
      <a [routerLink]="['/productos', producto().id]" class="link link-hover">
        <h2 class="font-semibold text-lg leading-tight line-clamp-2 text-base-content" [title]="producto().nombre">
          {{ producto().nombre }}
        </h2>
      </a>
    </div>

    <div class="mt-1">
      <span class="text-[10px] uppercase tracking-[0.14em] text-base-content/40 font-semibold">Precio</span>
      <p class="text-2xl font-bold text-base-content">${{ producto().precio | number:'1.0-0' }}</p>
    </div>

    <div class="card-actions mt-3">
      <button class="btn btn-neutral w-full rounded-full border-neutral
              hover:bg-primary hover:border-primary transition-all duration-200"
        [disabled]="agregando()" (click)="onAgregarClick()">
        @if (agregando()) {
        <span class="loading loading-spinner loading-sm"></span>
        Agregando...
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
          class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437m0 0L6.75 12.75A2.25 2.25 0 0 0 8.93 14.5h7.94a2.25 2.25 0 0 0 2.18-1.75l1.35-5.625a.75.75 0 0 0-.728-.925H5.106Zm0 0L4.5 3.75m4.5 14.25a1.125 1.125 0 1 1-2.25 0 1.125 1.125 0 0 1 2.25 0Zm8.25 0a1.125 1.125 0 1 1-2.25 0 1.125 1.125 0 0 1 2.25 0Z" />
        </svg>
        Agregar al carrito
        }
      </button>
    </div>
  </div>
</div>
