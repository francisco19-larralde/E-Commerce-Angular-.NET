<div class="search-box">
  <form (ngSubmit)="onSubmit()" class="search-box__form">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="m21 21-5.2-5.2m0 0A7.5 7.5 0 1 0 5.2 5.2a7.5 7.5 0 0 0 10.6 10.6Z" />
    </svg>
    <input type="search" placeholder="¿Qué estás buscando?" [ngModel]="termino()"
      (ngModelChange)="onInput($event)" name="busqueda" autocomplete="off" aria-label="Buscar productos" />
    @if (buscando()) { <span class="search-box__loader"></span> }
  </form>

  @if (mostrarDropdown() && termino().trim().length >= 2) {
  <div class="search-results">
    @if (resultados().length > 0) {
    <ul>
      @for (producto of resultados(); track producto.id) {
      <li>
        <button type="button" (click)="irADetalle(producto)">
          <span class="search-results__image">
            @if (producto.imagenUrl) {
            <img [src]="producto.imagenUrl" [alt]="producto.nombre" />
            } @else { <b>{{ producto.nombre.charAt(0) }}</b> }
          </span>
          <span class="search-results__copy">
            <strong>{{ producto.nombre }}</strong>
            <small>{{ producto.categoriaNombre }}</small>
          </span>
          <span class="search-results__price">${{ producto.precio | number:'1.0-0' }}</span>
        </button>
      </li>
      }
    </ul>
    } @else if (!buscando()) {
    <p class="search-results__empty">No encontramos resultados para “{{ termino() }}”.</p>
    }
  </div>
  }
</div>
