<div class="landing-page">
  <header class="landing-header">
    <a routerLink="/" class="brand" aria-label="Luma, inicio">
      <span class="brand-mark">L</span><span>LUMA</span>
    </a>
    <nav class="landing-nav" aria-label="Navegación de la landing">
      <a href="#experiencia"><span>01</span> Colección</a>
      <a href="#beneficios"><span>02</span> Beneficios</a>
    </nav>
    <div class="landing-header__actions">
      <a routerLink="/login" class="landing-login">Ingresar</a>
      <a routerLink="/home" class="header-action">Ir a la tienda <span aria-hidden="true">→</span></a>
    </div>

    <div class="landing-mobile-menu">
      <button type="button" class="landing-menu-toggle" [class.landing-menu-toggle--open]="menuAbierto()"
        (click)="alternarMenu()" [attr.aria-expanded]="menuAbierto()" aria-label="Abrir menú">
        <span></span><span></span>
      </button>
      @if (menuAbierto()) {
      <div class="landing-mobile-menu__panel">
        <nav aria-label="Navegación móvil de la landing">
          <a href="#experiencia" (click)="cerrarMenu()"><small>01</small> Colección <b>→</b></a>
          <a href="#beneficios" (click)="cerrarMenu()"><small>02</small> Beneficios <b>→</b></a>
          <a routerLink="/home" (click)="cerrarMenu()"><small>03</small> Tienda <b>→</b></a>
        </nav>
        <div><a routerLink="/login" (click)="cerrarMenu()">Ingresar</a><a routerLink="/registro" (click)="cerrarMenu()">Crear cuenta</a></div>
      </div>
      }
    </div>
  </header>

  <main>
    <app-landing-hero />
    <app-landing-editorial />
    <app-landing-benefits />
  </main>

  <footer class="landing-footer">
    <a routerLink="/" class="brand"><span class="brand-mark">L</span><span>LUMA</span></a>
    <p>Una experiencia ecommerce desarrollada con Angular y ASP.NET Core.</p>
    <span>© 2026</span>
  </footer>
</div>
